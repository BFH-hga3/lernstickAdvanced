disable_timeout

function export_locales_and_keyboard {
	set LOCALES="${1}"
	export LOCALES
	set KEYBOARD="${2}"
	export KEYBOARD
	set_grub_language
	go_to_main_menu
}

menuentry $"Select language:" --unrestricted {
	go_to_main_menu
}

entry_text="Deutsch (Schweiz)"
if [ "${LOCALES}" = "de_CH.UTF-8" ]
then
	menuentry "* ${entry_text}" --unrestricted {
		go_to_main_menu
	}
else
	menuentry "  ${entry_text}" --unrestricted {
		export_locales_and_keyboard "de_CH.UTF-8" "ch(de),ch(fr),de,fr"
	}
fi

entry_text="Français (Suisse)"
if [ "${LOCALES}" = "fr_CH.UTF-8" ]
then
	menuentry "* ${entry_text}" --unrestricted {
		go_to_main_menu
	}
else
	menuentry "  ${entry_text}" --unrestricted {
		export_locales_and_keyboard "fr_CH.UTF-8" "ch(fr),ch(de),fr,de"
	}
fi

entry_text="Italiano (Svizzera)"
if [ "${LOCALES}" = "it_CH.UTF-8" ]
then
	menuentry "* ${entry_text}" --unrestricted {
		go_to_main_menu
	}
else
	menuentry "  ${entry_text}" --unrestricted {
		export_locales_and_keyboard "it_CH.UTF-8" "it,ch(de),ch(fr),fr"
	}
fi

