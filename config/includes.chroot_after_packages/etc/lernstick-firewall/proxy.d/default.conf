# lernstick-firewall URL whitelist — MSE Exam Environment
# Format: one regex per line, matched against the full request URL.
# Rules are evaluated top-to-bottom; first match wins.

# ── Moodle ────────────────────────────────────────────────────────────────────
# Main Moodle instance
^(http|https)://moodle\.msengineering\.ch

# ── SWITCHaai authentication ──────────────────────────────────────────────────
# WAYF (Where Are You From) federation discovery service
^https://wayf\.switch\.ch/SWITCHaai
# AAI login endpoints
^https://aai\.switch\.ch
^https://eduid\.switch\.ch

# ── eduID / AAI identity provider ─────────────────────────────────────────────
^https://login\.eduid\.ch
^https://[a-zA-Z0-9-]+\.login\.eduid\.ch
^https://static\.eduid\.ch

# ── SWITCHdrive — specific shares only ────────────────────────────────────────
# FileDrop share (student file submission)
^https://drive\.switch\.ch/index\.php/s/NnNaOgN4lHaqe2M

# LibreOffice template share (download at login)
^https://drive\.switch\.ch/index\.php/s/tQLKBilUJ7l8DLj

# Static assets required for the SWITCHdrive share page to render correctly:
# CSS stylesheets, JavaScript bundles, web fonts, favicons, icons.
# These are served from /apps/, /core/, /themes/ paths — NOT from /index.php/s/
# so they cannot be used to browse other shares.
^https://drive\.switch\.ch/apps/
^https://drive\.switch\.ch/core/
^https://drive\.switch\.ch/themes/
^https://drive\.switch\.ch/dist/
^https://drive\.switch\.ch/s/[A-Za-z0-9]+/ajax/status
^https://drive\.switch\.ch/s/[A-Za-z0-9]+/ajax/upload

# ── Explicitly blocked (belt-and-suspenders) ──────────────────────────────────
# All other drive.switch.ch paths are NOT listed and therefore blocked by
# the lernstick-firewall default-deny policy. This includes:
#   - /index.php/f/ (file browser)
#   - /index.php/apps/ (app pages)
#   - Any other share not listed above
