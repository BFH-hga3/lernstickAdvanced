# lernstick-firewall URL whitelist — MSE Exam Environment
# Format: one regex per line, matched against the full request URL.
# drive.switch.ch runs ownCloud Server 10.
# Squid uses POSIX ERE — no lookaheads (?!...) supported.
# Rules are evaluated top-to-bottom; first match wins.

# ── Moodle ────────────────────────────────────────────────────────────────────
^https://moodle\.msengineering\.ch

# ── SWITCHaai / eduID authentication ─────────────────────────────────────────
^https://wayf\.switch\.ch/SWITCHaai
^https://aai\.switch\.ch
^https://eduid\.switch\.ch
^https://login\.eduid\.ch
^https://[a-zA-Z0-9-]+\.login\.eduid\.ch
^https://static\.eduid\.ch

# ── SWITCHdrive (ownCloud Server 10) ─────────────────────────────────────────

# Explicit share URLs
^https://drive\.switch\.ch/index\.php/s/NnNaOgN4lHaqe2M
^https://drive\.switch\.ch/index\.php/s/tQLKBilUJ7l8DLj

# OnlyOffice settings endpoint (specific exception — full path, no editor)
^https://drive\.switch\.ch/index\.php/apps/onlyoffice/ajax/settings$

# Allowed ownCloud apps — explicit allowlist instead of negative lookahead
# (Squid POSIX ERE does not support lookaheads)
^https://drive\.switch\.ch/index\.php/apps/files_sharing/
^https://drive\.switch\.ch/index\.php/apps/federatedfilesharing/
^https://drive\.switch\.ch/index\.php/apps/capabilities
^https://drive\.switch\.ch/index\.php/apps/activity/
^https://drive\.switch\.ch/index\.php/apps/comments/

# Core JS
^https://drive\.switch\.ch/index\.php/core/

# WebDAV upload endpoints
^https://drive\.switch\.ch/public\.php/
^https://drive\.switch\.ch/remote\.php/dav/public-files/

# OCS API and status
^https://drive\.switch\.ch/ocs/
^https://drive\.switch\.ch/status\.php

# Static assets (CSS, JS, fonts, icons)
^https://drive\.switch\.ch/core/
^https://drive\.switch\.ch/themes/
^https://drive\.switch\.ch/dist/
^https://drive\.switch\.ch/apps/
