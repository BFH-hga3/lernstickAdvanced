<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C99B4"/>
      <stop offset="1" stop-color="#6A89A7"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect x="8" y="8" width="240" height="240" rx="44" ry="44" fill="url(#bg)"/>
  <!-- Subtle inner keyline -->
  <rect x="8" y="8" width="240" height="240" rx="44" ry="44" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
  <!-- MSE wordmark -->
  <text x="128" y="132"
        font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" letter-spacing="2"
        text-anchor="middle" fill="#FFFFFF">MSE</text>
  <!-- Underline accent bar -->
  <rect x="66" y="150" width="124" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.9"/>
  <!-- Small caption -->
  <text x="128" y="196"
        font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="400" letter-spacing="1"
        text-anchor="middle" fill="#FFFFFF" fill-opacity="0.92">Engineering</text>
</svg>
